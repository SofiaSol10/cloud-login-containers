<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f9; }
    form { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
    input { width: 100%; padding: 0.5rem; margin: 0.5rem 0 1rem 0; box-sizing: border-box; }
    button { width: 100%; padding: 0.5rem; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .error { color: red; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <form action="/login" method="POST">
    <h2>Iniciar Sesión</h2>
    <div id="error" class="error"></div>
    <label>Usuario:</label>
    <input type="text" name="username" required>
    <label>Contraseña:</label>
    <input type="password" name="password" required>
    <button type="submit">Ingresar</button>
    <p><a href="/register">Crear una cuenta</a></p>
  </form>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('error')) {
      document.getElementById('error').innerText = 'Credenciales inválidas. Intente de nuevo.';
    }
  </script>
</body>
</html>
